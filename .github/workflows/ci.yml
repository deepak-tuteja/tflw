name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # M108 (`M107-03`). `@tflw/runtime` no longer runs under `--test-force-exit`, so a test that
    # leaks a ref'd handle now hangs its file instead of being killed mid-report — the honest
    # failure, but an unbounded one: GitHub's default job timeout is 6 hours. This bounds it.
    #
    # 45, from measured job times rather than a guess: Node 24 runs ~5m, Node 22 ~14m before this
    # milestone (runs 31262598051 and 31260733007, 14m14s and 14m20s) and **16m4s** with M108's
    # added mutation — a control that costs ~50s locally costs ~1m50s on a 2-core runner. So the
    # long leg is already 16m and 30 would have left under 2× headroom on the slowest job in the
    # matrix. Re-measure this when the mutation registry grows again; it is the step that moves.
    #
    # M112: the registry grew, so this is that re-measurement. M111 added 7 mutations and — more
    # expensively — two packages the sweep had never baselined, one of them `tflw`, whose suite is
    # ~119s locally against `@tflw/lang`'s 2s. Measured on run 31277101858, the first Node 22 job
    # to finish a full sweep after the fix: **job 26m59s**, of which the mutation step is **16m41s**
    # (10m12s locally, so 1.64×) and `Coverage` a further 5m36s. The cli suite itself is 2m39s per
    # run there against 119s here. So M111 cost the long leg ~11m, mostly in three cli suite runs
    # (baseline + 2 mutations) that did not exist before it.
    #
    # 45 would have left 1.7× on a 27m job, under the 2× this number has always been chosen for —
    # the hang and the budget came due in the same run. 60 gives 2.2×. Note
    # the backstop moved inward — `mutate.mjs` now bounds each suite at 10m and names the package
    # that hung, so this number no longer has to be the thing that catches a hang.
    #
    # M124: the re-measurement the M112 note asks for, and it moved the sweep *out* of this job
    # rather than moving this number (see the `mutations` job below). What is left here is
    # build+typecheck+test+coverage: **13m** of the 60m that were being spent, on the same run
    # 31412181636 that cancelled. The generous multiple is now deliberate rather than accidental —
    # nothing in this job grows the way the mutation registry does, so there is nothing left here to
    # re-measure per milestone.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The browser arc's tests launch real Chromium/Firefox (packages/runtime's browser-steps
      # and pick-session tests, packages/cli's watch/e2e --browser firefox test) — `playwright`
      # has no postinstall download hook, so without this every launch fails with "Executable
      # doesn't exist" (confirmed on the first CI run after the browser arc landed, run 30316651481).
      # Only the two engines the suite actually exercises; webkit is a documented `--browser`
      # option but nothing launches it yet.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - run: npm run build

      - run: npm run typecheck

      # packages/cli's watch.test.ts launches a real --headed browser window (the whole point of
      # `tflw watch`), and ubuntu-latest has no X display — Playwright's own error names the fix:
      # "use 'xvfb-run <your-playwright-app>'" (confirmed on run 30317696061, the first CI run
      # after the Playwright-browser-install fix (978c4bb) got everything else passing: runtime
      # 306/306, lang 381/381, reporter 38/38, lsp-server 90/90, cli 87/90 — only the 3 headed
      # watch tests failed with "Missing X server or $DISPLAY").
      # M107b (`M106-03`): the root `npm test` is `scripts/verify-test-counts.mjs`, which runs the
      # suites (`test:raw`) and then asserts each workspace ran the number of tests it contains.
      # `@tflw/lsp-server` was reporting 111/112/113 on an unchanged tree — `--test-force-exit`
      # dropping the tail of a file, with the plan line and the summary agreeing on the smaller
      # number, so nothing could go red. A test that never reports cannot fail.
      - run: xvfb-run -a npm test

      # A test naming a `TF0xx` code its harness cannot emit is a passing test of nothing — the
      # shape that survived two mutations in M98d. Static, so it runs in seconds and needs no
      # mutation pass. Before `npm test` would be wrong: a red suite is the more useful signal.
      - run: npm run verify:observability

      # The root `scripts/` tools' own tests (M113). `verify-ledger.mjs` checks a corpus that is
      # gitignored on purpose, so the guard itself cannot run here — its input is simply absent, and
      # a check that skips when its input is missing is green about nothing, which is the exact
      # failure it was built to stop. So the *guard* runs locally before a milestone is called done
      # (`npm run verify:ledger`, hard-failing on a missing ledger) and *this* step verifies the
      # guard: fixture ledgers carrying known defects, including reconstructions of `M98c-02`'s
      # missing `🚫` and `M99`'s three rows left `open` after the code shipped. Seconds, no display,
      # both Node versions — it is plain stdlib and the matrix is what would catch it if that stopped
      # being true. Not folded into `npm test`: that script is a per-workspace headcount, and root
      # scripts belong to no workspace — which does mean these tests sit outside the headcount
      # `verify-test-counts.mjs` enforces on the other 1,897. Filed as `M113-03`, not papered over.
      - run: npm run test:scripts

      # Every internal anchor on the docs site resolves to a real heading (M62/DT-07), and every
      # page renders the sidebar it belongs to (M125e/`FU-30`). Separate from `npm test` because
      # both read the built `.vitepress/dist` — the root `npm run build` above already produced it.
      # Here rather than only in docs.yml so a pull request sees a broken link or a wrong rail too:
      # docs.yml runs on pushes to main, after review.
      - run: npm run test:links -w @tflw/docs-site

      # Coverage baseline (decision: M21) — informational only, no threshold gate yet (a
      # green-field target picked before a real baseline exists is unfair debt). Runs once (not
      # once per Node version in the matrix) since it's the same source regardless of runtime.
      # Also needs xvfb-run: `c8 npm test` re-runs the same headed watch tests underneath.
      - name: Coverage
        if: matrix.node-version == 22
        run: xvfb-run -a npm run coverage

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  # ---------------------------------------------------------------------------
  # M124 (`M114-01`, finally re-measured) — the mutation sweep gets its own job.
  #
  # It was step 10 of the `test` job for fourteen milestones, and `M114-01` has been open the whole
  # time asking what it costs. The answer arrived as a cancellation rather than a number: on run
  # 31412181636 the Node 22 leg spent **51m24s** in the sweep, finished it *green*, and then died on
  # `timeout-minutes: 60` three minutes into `Coverage`. Nothing was broken — the job simply ran out
  # of clock with the work done. That is the worst way for this to fail, because the sweep's own
  # result was thrown away along with the job.
  #
  # The trend is the argument for a structural fix rather than a bigger number: the step measured
  # 16m41s at M112 (7 mutations added), and M123's ten more took it to 51m24s. It grows every
  # milestone, by design — that is what a mutation registry is — and every milestone that adds one
  # was quietly spending the `test` job's budget. M124 adds six more.
  #
  # So: its own job, running in parallel with the matrix instead of serially after it. Three things
  # fall out. The sweep no longer shares a clock with anything (a slow suite cannot cancel it, and
  # it cannot cancel `Coverage`); the wall clock for the whole workflow becomes max(13m, sweep)
  # rather than their sum; and the next milestone to add a mutation reads *this* number, in the job
  # that is actually about mutations.
  #
  # Node 22 only, for the reason it always was: mutations are source edits, identical under every
  # runtime, so the matrix would just pay for it twice.
  #
  # ---------------------------------------------------------------------------
  # M127 (`M126-01`) — and now sharded, because M124's own number came due.
  #
  # M124 gave the sweep this job and 90 minutes against a measured 51m24s. Seven milestones later it
  # measured **1h13m11s** (run 31540764432), having gone 51m → 53m → 55m → 59m → 69m → 71m → 73m in
  # about two days: 17 minutes of headroom, and the estimate that called it "roughly eleven more
  # milestones" had bought five. A fourth larger number is not a fix, and `M114`'s rule forbids the
  # cheap structural one — scoping the sweep on PRs is how `M122-01` stayed invisible.
  #
  # So the registry is dealt across six machines and every mutation still runs on every pull
  # request. Six from the measurement rather than taste: the cost is per *package* (a baseline is
  # one more run of the same suite), `@tflw/runtime` and `tflw` hold 81% of it, and the deal that
  # falls out models at **12.4m–13.6m of suite time per shard** against ~12m for the `test` matrix
  # beside it — so the workflow's critical path barely moves and no shard is the long pole. Four
  # shards would leave 19.5m; eight cost 4 more minutes of CPU and save nothing, because the longest
  # shard is then bound by a single package's suite rather than by the split. Total CPU goes
  # 72m → 78m, which is the six extra baselines, paid once.
  #
  # MEASURED on the first sharded run (31582297232, PR #57) — the number to trust over the model:
  # 13m32s · 14m09s · 14m31s · 15m05s · 15m18s · **16m43s**, a 23% spread. The model predicts *suite*
  # time and a job is suite time plus ~50s of setup plus runner variance, so it reads about 15% light
  # in absolute terms. That does not matter: what the packing controls is the spread, not the
  # absolute. The whole workflow's critical path goes **1h13m11s → 16m43s**.
  #
  # 30 minutes per shard — 1.8× the measured longest, deliberately less than the 2× the `test` job's
  # number is chosen for. This is the one job with an *inward* backstop: `mutate.mjs` bounds each
  # package's suite at 10m and names the package that hung (M112), so this number does not have to
  # catch a hang, only survive ordinary growth. The lever when it comes due is the `shard:` list
  # below — a one-line edit, which is the actual point of this milestone.
  mutations:
    name: mutation controls (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A shard that fails must not cancel its siblings: their manifests are what `mutation
      # controls` reassembles, and a cancelled shard uploads nothing. One red shard would otherwise
      # turn a precise "these mutations survived" into "the sweep did not cover the registry".
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `mutate.mjs` baselines a package before its first mutation, and M111 added the first
      # `pkg: 'tflw'` entries — so the cli suite runs here, and it launches real headed Chromium
      # through the real dist binary. Without these two steps it blocks forever rather than failing:
      # run 31273904180 died after 31 minutes of silence, and the same suite passed under `xvfb-run`
      # four steps earlier in the same job (M112).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - run: npm run build

      # A control that killed a mutation once can stop killing it without any test turning red —
      # which is how M98c's `isUnlexable` control went vacuous in the first place, and how the `#`
      # case was still uncovered five milestones later.
      #
      # Unscoped, and that is `M114`'s rule rather than a default: a scoped sweep is how `M122-01`
      # stayed invisible — a merged registry entry left one mutation not merely surviving but
      # *absent*, and every scoped run was green about a mutation that no longer existed.
      #
      # A shard is not a scope. `--shard=i/6` is a slice of the *whole* registry — the union of the
      # six is the registry, and `mutation controls` below is what proves that rather than assumes
      # it. `mutate.mjs` refuses `--shard` combined with a scope for exactly this reason.
      - name: Mutation controls
        run: xvfb-run -a node scripts/mutate.mjs --shard=${{ matrix.shard }}/6 --manifest=shard-${{ matrix.shard }}.json

      # `always()` because a shard that found a survivor still has to say what it ran. Otherwise a
      # red shard and a shard that never started are the same missing file, and the job below cannot
      # tell "a mutation survived" from "thirty mutations were never applied".
      - name: Upload this shard's manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # M127 — the job that says the shards added up, and the only one entitled to.
  #
  # Each shard above is green about itself and cannot be green about the others. The number of
  # shards is written twice — in `shard:` and in `--shard=i/6` — and nothing in YAML holds those
  # together: delete `4` from the matrix and five jobs run, all five pass, and thirty mutations are
  # never applied. Every one of those jobs is telling the truth.
  #
  # So this reassembles the registry from what the shards wrote down. It keeps the old job's name on
  # purpose: `mutation controls` is the check that has always meant "every mutation ran and none
  # survived", and it still does — it is just no longer the job that runs them.
  mutation-controls:
    name: mutation controls
    needs: mutations
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: `verify-shards.mjs` and the registry it reads are stdlib-only, and a dependency
      # install is one more way for this check to fail for reasons that have nothing to do with it.
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: shards

      # The shards' own verdicts first — a survivor is the more useful thing to read at the top of a
      # failure than a coverage sum. `needs.mutations.result` collapses the whole matrix to one word.
      - name: Every shard passed
        if: needs.mutations.result != 'success'
        run: |
          echo "::error::the mutation shards did not all pass (${{ needs.mutations.result }}) — read the shard jobs for which mutation survived"
          exit 1

      # And then coverage, which is the half no individual shard can attest to.
      - name: Every mutation was run by some shard
        run: node scripts/verify-shards.mjs shards --of=6
