name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # M108 (`M107-03`). `@tflw/runtime` no longer runs under `--test-force-exit`, so a test that
    # leaks a ref'd handle now hangs its file instead of being killed mid-report — the honest
    # failure, but an unbounded one: GitHub's default job timeout is 6 hours. This bounds it.
    #
    # 45, from measured job times rather than a guess: Node 24 runs ~5m, Node 22 ~14m before this
    # milestone (runs 31262598051 and 31260733007, 14m14s and 14m20s) and **16m4s** with M108's
    # added mutation — a control that costs ~50s locally costs ~1m50s on a 2-core runner. So the
    # long leg is already 16m and 30 would have left under 2× headroom on the slowest job in the
    # matrix. Re-measure this when the mutation registry grows again; it is the step that moves.
    #
    # M112: the registry grew, so this is that re-measurement. M111 added 7 mutations and — more
    # expensively — two packages the sweep had never baselined, one of them `tflw`, whose suite is
    # ~119s locally against `@tflw/lang`'s 2s. Measured on run 31277101858, the first Node 22 job
    # to finish a full sweep after the fix: **job 26m59s**, of which the mutation step is **16m41s**
    # (10m12s locally, so 1.64×) and `Coverage` a further 5m36s. The cli suite itself is 2m39s per
    # run there against 119s here. So M111 cost the long leg ~11m, mostly in three cli suite runs
    # (baseline + 2 mutations) that did not exist before it.
    #
    # 45 would have left 1.7× on a 27m job, under the 2× this number has always been chosen for —
    # the hang and the budget came due in the same run. 60 gives 2.2×. Note
    # the backstop moved inward — `mutate.mjs` now bounds each suite at 10m and names the package
    # that hung, so this number no longer has to be the thing that catches a hang.
    #
    # M124: the re-measurement the M112 note asks for, and it moved the sweep *out* of this job
    # rather than moving this number (see the `mutations` job below). What is left here is
    # build+typecheck+test+coverage: **13m** of the 60m that were being spent, on the same run
    # 31412181636 that cancelled. The generous multiple is now deliberate rather than accidental —
    # nothing in this job grows the way the mutation registry does, so there is nothing left here to
    # re-measure per milestone.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The browser arc's tests launch real Chromium/Firefox (packages/runtime's browser-steps
      # and pick-session tests, packages/cli's watch/e2e --browser firefox test) — `playwright`
      # has no postinstall download hook, so without this every launch fails with "Executable
      # doesn't exist" (confirmed on the first CI run after the browser arc landed, run 30316651481).
      # Only the two engines the suite actually exercises; webkit is a documented `--browser`
      # option but nothing launches it yet.
      #
      # M143a — no `--with-deps`, and that is a measurement rather than a preference.
      #
      # `--with-deps` runs `apt-get install` on every job of every run: 48.8 MB from
      # azure.archive.ubuntu.com, fetched independently by fourteen concurrent jobs. Read at STEP
      # level across 108 shard-jobs (9 runs), this step's median was 0.7m and its max 14.5m — 242
      # minutes burned where the median would cost 74, and the entire tail is apt. The step's own
      # log settles which half owns it: 48.8 MB of apt in 14min3s at 58 kB/s, then ~340 MB of
      # browser archives from cdn.playwright.dev in about six seconds. The browsers are fifty times
      # bigger and two hundred times faster, so caching `~/.cache/ms-playwright` — the obvious fix,
      # and the one this milestone's seed proposed — would have saved those six seconds and
      # prevented none of the stalls.
      #
      # On run 32272901684 the same stall cancelled NINE OF TWELVE mutation shards at their 30m
      # ceiling with zero mutations applied, and held this job 45.9m against its 60m one.
      #
      # What apt fetches is fonts (CJK, Thai, colour emoji) and media codecs; `ubuntu-latest`
      # already carries Playwright's real dependency closure. Nothing in this suite renders CJK
      # text or plays video, and the `matches snapshot` tests seed their own baseline inside the
      # same temp run — there are no committed baseline PNGs — so font availability moves both
      # sides of every comparison equally.
      #
      # If an engine ever does fail to launch, Playwright names the missing library on stderr:
      # install that one, by name, here. Never the closure again.
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - run: npm run build

      - run: npm run typecheck

      # packages/cli's watch.test.ts launches a real --headed browser window (the whole point of
      # `tflw watch`), and ubuntu-latest has no X display — Playwright's own error names the fix:
      # "use 'xvfb-run <your-playwright-app>'" (confirmed on run 30317696061, the first CI run
      # after the Playwright-browser-install fix (978c4bb) got everything else passing: runtime
      # 306/306, lang 381/381, reporter 38/38, lsp-server 90/90, cli 87/90 — only the 3 headed
      # watch tests failed with "Missing X server or $DISPLAY").
      # M107b (`M106-03`): the root `npm test` is `scripts/verify-test-counts.mjs`, which runs the
      # suites (`test:raw`) and then asserts each workspace ran the number of tests it contains.
      # `@tflw/lsp-server` was reporting 111/112/113 on an unchanged tree — `--test-force-exit`
      # dropping the tail of a file, with the plan line and the summary agreeing on the smaller
      # number, so nothing could go red. A test that never reports cannot fail.
      #
      # M134 (`M130-04`/`M113-03`): this step now also runs the root `scripts/` tools' own tests
      # (M113) and headcounts them, so they are no longer a separate step below. `verify-ledger.mjs`
      # checks a corpus that is gitignored on purpose, so the guard itself cannot run here — its
      # input is simply absent, and a check that skips when its input is missing is green about
      # nothing, which is the exact failure it was built to stop. So the *guard* runs locally before
      # a milestone is called done (`npm run verify:ledger`, hard-failing on a missing ledger) and
      # the suite folded in here verifies the guard: fixture ledgers carrying known defects,
      # including reconstructions of `M98c-02`'s missing `🚫` and `M99`'s three rows left `open`
      # after the code shipped.
      - run: xvfb-run -a npm test

      # A test naming a `TF0xx` code its harness cannot emit is a passing test of nothing — the
      # shape that survived two mutations in M98d. Static, so it runs in seconds and needs no
      # mutation pass. Before `npm test` would be wrong: a red suite is the more useful signal.
      - run: npm run verify:observability

      # Every guard declares the corpus it reads, and the declaration is checked (`M171a`, `D874`).
      # Two tiers on purpose, and this is the half that can run here: the plants are synthetic, so
      # they need no records and prove the thing a docblock cannot — that a violation placed inside
      # a declared corpus is actually caught. The *resolution* tier needs the gitignored records and
      # says out loud that it did not run, which is `D683`'s shape and `M171`'s own subject: a gate
      # whose corpus is narrower than its subject reports a clean number, never a smaller one.
      - run: npm run verify:corpora

      # `M191` (`D997`). `tflw fmt`'s gate over this repository's own `.tflw` files: the same tokens
      # in the same order with trivia excluded, every comment kept, idempotent — and under `--check`
      # that every file is already formatted, so the formatter's own corpus can never fail the
      # check it asks of the sibling's. A `.checkonly/` fixture that is broken on purpose is refused
      # by design and listed, not counted. Milliseconds, after the build.
      - run: npm run verify:fmt-roundtrip -- --check

      # `M172e` (`M155-02`). The one gate here whose subject is the OTHER repository's build. A
      # check-phase `TF0xx` code assigned in this repository is a breaking change for
      # `testFlow-tests`' `main` with no additive path, and until now nothing on this side read that
      # rule: `M165` assigned `TF081`, merged green here as `cb42cce`, and the sibling's next run
      # failed on a code it had never heard of. The author of the breaking commit was never the one
      # who saw the red, which is the asymmetry the row files.
      #
      # It compares this build's manifest against `scripts/sibling-citations.json`'s `checkFixtures`
      # — a pin rather than a checkout, because `D710` refuses adding a sibling checkout to this
      # repository's CI and `D511` fixes the merge order regardless. So it reads a snapshot, and it
      # can therefore only see the failure that travels in THIS direction: a code added here. A
      # fixture removed there is the sibling's own assertion, over there, against its real tree.
      #
      # Needs `packages/lang/dist` — the `build` step above — because it reads the manifest out of
      # the bundle a user would install, which is the same artifact the sibling's `assignedCodes()`
      # reads. Reading `spec-data.ts` instead would let the two repositories disagree about what
      # tflw assigns while each was right about its own input.
      - run: npm run verify:check-coverage

      # `M179b` (`D920`). The pin the step above reads is only worth reading if it still resolves,
      # and until now the one gate that checks that never ran here. Its docblock said it needed "the
      # network and a credential" and pointed at `verify-provenance.mjs` declining the same check on
      # a depth-1 clone — two unrelated blockers conflated into one sentence. `verify-provenance.mjs`
      # declines because a depth-1 clone lacks the objects it must walk; that is a git problem and
      # its reason still stands. This gate uses no git at all, only `gh api`, and BOTH repositories
      # are public, so it needs nothing Actions does not already hand it. That wrong sentence is why
      # the pin died five times in two days with the only instrument that could see it unreachable
      # from CI (`M176-06`).
      #
      # `--require-network` is not optional decoration (`D921`). Without it a broken token would make
      # every clause stop running while the job stayed green — the `D683` skip is honest on a laptop
      # and is a vacuous gate here, which is `M141`'s shape planted in the gate that closes the row.
      # With it, "did not run" is a failure and the tier's own reachability is observable.
      - run: npm run verify:sibling-pin -- --require-network
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `D922`. The gate above shipped into CI with a reachability probe that asked `gh api user` —
      # green here, red there, in the same commit, because `GITHUB_TOKEN` is an App installation
      # token with no user behind it while every read the gate makes is public (measured
      # unauthenticated: the three clause reads answer 200 and `/user` answers 401). It had no
      # controls at all, which is how that reached CI. These four are them, and they need no network.
      - run: npm run verify:sibling-pin:self-test

      # `DECISIONS.md` is the resolution target for the private notation this repo is written in —
      # `P#43`, `D318`, `M137d`, roughly 730 citations of records `.gitignore` excludes (M152/`D666`).
      # THIS STEP RUNS ONLY HALF THE CHECK, and says so rather than printing a bare green. Both
      # sides of the conformance and scrub tiers are tracked, so they run here: no cited identifier
      # lacks an entry, no entry lacks a citation, nothing in the scrub classes leaks into a public
      # commit. The third tier — that each entry is still byte-identical to the record it was lifted
      # from — cannot run on a runner, because those records are the 66 gitignored files (`D683`).
      # That half is checked on a developer machine by the same command and by review. `D527`'s rule
      # is why the skip is printed: a tier that silently does not run reads exactly like a tier that
      # passed.
      - run: npm run verify:decisions

      # `M186d` (`D959`). `verify:decisions` above enforces the PROSE half of `D858` — every cited
      # identifier has an entry. This enforces the shape of the answer to the other half. An
      # identifier cited only in tracked code resolves in the records and is deliberately not
      # published (`D858`), so `scripts/own-identifiers.json` is what lets a reader of a public file
      # tell a live decision from a typo — and its whole safety property is that it carries names and
      # nothing lifted from a record. That property degrades by good intentions, one clause of
      # helpful context at a time, so it is asserted rather than promised. Both sides are tracked, so
      # this is a full check here and not a half one; the *currency* half needs the gitignored
      # records and stays a developer discipline (`D859`), which the gate prints rather than passing
      # over in silence.
      - run: npm run verify:own-identifiers

      # Its controls, for `D922`'s reason exactly — a gate whose failure modes nothing demonstrates
      # is a gate nobody has seen work. Eleven, and the load-bearing two are the ones that fail on an
      # identifier carrying one clause of context and on a declaration reason edited by a single
      # character.
      - run: npm run verify:own-identifiers:self-test

      # The other half of `D666`. `verify:decisions` keeps every *canonical* citation pointed at an
      # entry that exists; this keeps prose from writing the older spelling, `decision 57`, which
      # names a number without saying which of nine numbered sequences indexes it (`M152b`/`D691`).
      # A bare number is worse than an unresolvable identifier because it looks resolvable: 22
      # numbers publish both a `P#n` and a `D<n>` entry today, on unrelated subjects. It runs here
      # and not only on a developer machine because both sides are tracked — unlike the tier above,
      # nothing it reads is gitignored.
      - run: npm run verify:citations

      # Every `SPEC.md#<fragment>` a tracked file links to resolves to a real heading (`D677`).
      # Six were already dead when this was written, all on user-facing docs pages, because GitHub
      # does not 404 on a bad fragment — it serves the page and drops the reader at the top of a
      # 3,700-line document, so nothing ever reported them. The heading slugs are computed by
      # `scripts/github-slug.mjs`, whose rule is held against GitHub's own anchors by
      # `github-slug.test.mjs`; that corpus is refreshed by hand, and only the comparison runs here.
      - run: npm run verify:anchors

      # Every internal anchor on the docs site resolves to a real heading (M62/DT-07), and every
      # page renders the sidebar it belongs to (M125e/`FU-30`). Separate from `npm test` because
      # both read the built `.vitepress/dist` — the root `npm run build` above already produced it.
      # Here rather than only in docs.yml so a pull request sees a broken link or a wrong rail too:
      # docs.yml runs on pushes to main, after review.
      - run: npm run test:links -w @tflw/docs-site

      # Coverage — THIS STEP GATES. It has since `M86` added `"check-coverage": true` to
      # `.c8rc.json`, and until `M137a` this comment still carried `M21`'s sentence saying it did
      # not ("informational only, no threshold gate yet"). Two commits, one of which made the
      # other's sentence false, and nothing noticed for fifty milestones (`M134a-01`).
      #
      # THE MEASURED COST OF THAT, which is why the row was a row and not a chore: `M134a`'s run
      # went red on exactly this step with `# fail 0` in all eight suites, and the first reading of
      # the failure was that a test had flaked under `c8` — because the file describing the job said
      # the job could not fail. A stale orienting comment does not merely fail to help; it sends the
      # reader to look for a defect that is not there.
      #
      # A red Coverage step with every test green means the floor was crossed. The floor lives in
      # `.c8rc.json` and its derivation — measured 94.66 / 88.56 / 94.6 on 2026-08-05, pinned one
      # point low on purpose — is documented at length in `scripts/coverage.mjs`. **Do not lower it
      # to make a red run green.** Write the test the uncovered line is asking for.
      #
      # `M234`: THERE ARE TWO FLOORS NOW, and a red step is usually the second one. `.c8rc.json`
      # holds the aggregate backstop; `coverage-floors.json` holds one pin per package, and that is
      # the gate that actually names what slipped. A package with coverage and no pin fails there by
      # design. Both are derived in `scripts/coverage.mjs`, which also explains why the aggregate
      # moved 94 -> 90 when `packages/ui/src` entered the scope — a floor following its own subject,
      # not a floor lowered to make a run green.
      #
      # The four numbers are deliberately NOT repeated here. `M134a-01` prescribed copying them into
      # this comment; doing so would have created a fourth place they live and a fourth place they
      # can go stale, which is the exact defect this comment is being rewritten to repair. Two homes
      # (the machine-readable floor, and the prose explaining it) are what
      # `scripts/verify-coverage-comment.test.mjs` holds to each other.
      #
      # Runs once (not once per Node version in the matrix) since it's the same source regardless of
      # runtime. Also needs xvfb-run: `c8 npm test` re-runs the same headed watch tests underneath.
      - name: Coverage
        if: matrix.node-version == 22
        run: xvfb-run -a npm run coverage

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  # ---------------------------------------------------------------------------
  # `M194` — the mutation sweep no longer runs here.
  #
  # From `M124` to `M192` this file ended in a `mutations` matrix job and a `mutation-controls`
  # aggregate: the registry dealt across 6, then 12, 16, 18, 20, 23, 24, 28 and finally 33 two-core
  # runners, packed by a per-package cost table, watched by a re-shard trigger at two-thirds of the
  # job limit, with ~320 lines of re-shard history in this comment. The last run of that arrangement
  # (34901152848) killed 374 of 374 mutations and was red on the trigger alone, and the count that
  # cleared it honestly was 43 — three waves under GitHub's 20-concurrent-job cap.
  #
  # `M194` moved the sweep to the machine this repository does its heavy work on (`npm run sweep`,
  # `scripts/sweep.mjs` → `scripts/sweep-box.sh`, K trees at once) and `M195` retired it as a
  # standing gate the same day: it is a tool, run when a survivor is suspected, and no rule runs
  # it. The registry is frozen (`PLAN_M194_BOX_SWEEP.md`, D1010 — 371 entries the day it froze,
  # one more only when a plan's green condition needs a gate shown red): in 299 ledger rows no
  # mutation registered in an earlier milestone ever survived a later full sweep, so a mutation's
  # value is spent at authoring — a milestone runs the mutations it writes — and a sweep of the
  # whole registry, per push or per milestone, bought nothing the ledger could show. The
  # end-to-end layer is the sibling's regression sweep, which a milestone runs against its build
  # before it closes (`CONTRIBUTING.md`). `mutation controls` left branch protection with this job.
