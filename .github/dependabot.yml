# `M239` `E` (`D1320`). One grouped pull request a week for npm, one for the actions this
# workflow pins — merged by hand, never auto-merged, because a dependency bump in a testing tool
# is a change to what every user's run executes. The group keeps it to two reviews a week rather
# than one per package.
# Majors are left out of the groups (2026-09-27): a grouped PR carrying TypeScript 5.9 -> 7.0 and
# @types/node 22 -> 26 is a migration inside a bump, and one red major blocked every harmless minor
# beside it. A major arrives as its own pull request and is taken as its own piece of work.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
