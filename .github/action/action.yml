# `M252` `C` (`D1378`) — run a tflw suite in GitHub Actions.
#
# Lives here until 1.0 day, when its content moves to its own repository and is published there
# (on the owner's word — `D1379`: nothing is published before it). Until then `ci.yml`'s
# `action-dry-run` job runs it against `examples/storefront` from this tree's own packed CLI.
#
# tflw and its two peers are installed INTO the project (`npm i --no-save`), not globally: tflw
# resolves `playwright` from the project it runs, for its browser steps and for `install-browsers`,
# so a global install would leave both looking in the wrong place.
name: tflw
description: Run a tflw suite, keep its report as an artifact, and annotate each failing test.
author: tflw
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: The tflw version to install from npm.
    default: latest
  package:
    description: >-
      An npm install spec that replaces `tflw@<version>` — a tarball, a path, a git URL. The
      dry run uses it to install the CLI packed from the commit under test.
    default: ''
  args:
    description: >-
      What follows `tflw` on the command line, as shell words: `run`, `run --tag smoke`,
      `run --env staging --shard 1/3`.
    default: run
  working-directory:
    description: The project's directory — the one holding `tflw.config`.
    default: .
  browsers:
    description: Space-separated engines to download for UI steps (chromium, firefox, webkit); empty for none.
    default: chromium
  report:
    description: The report directory, relative to `working-directory` — `report` unless `tflw.config` names another.
    default: report
  artifact-name:
    description: The name the report is uploaded under.
    default: tflw-report
  node-version:
    description: The Node.js version to run on.
    default: '22'

outputs:
  exit-code:
    description: tflw's own exit code — 0 passed, 1 a test failed, 2 a usage error, 130 interrupted.
    value: ${{ steps.run.outputs.code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install tflw
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TFLW_SPEC: ${{ inputs.package != '' && inputs.package || format('tflw@{0}', inputs.version) }}
      run: npm i --no-save --no-audit --no-fund "$TFLW_SPEC" playwright axe-core

    - name: Download browsers
      if: inputs.browsers != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TFLW_BROWSERS: ${{ inputs.browsers }}
      run: for b in $TFLW_BROWSERS; do npx --no-install tflw install-browsers --browser "$b"; done

    # The exit code is carried, not raised here, so the report is uploaded and the failures are
    # annotated whatever happened — the last step raises it.
    - name: Run tflw
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TFLW_ARGS: ${{ inputs.args }}
      run: |
        set +e
        eval "npx --no-install tflw $TFLW_ARGS"
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.report }}
        if-no-files-found: ignore

    - name: Annotate failing tests
      if: always()
      shell: bash
      env:
        TFLW_JUNIT: ${{ inputs.working-directory }}/${{ inputs.report }}/junit.xml
        TFLW_DIR: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/annotate.mjs" "$TFLW_JUNIT" "$TFLW_DIR"

    - name: Exit with tflw's code
      if: always()
      shell: bash
      env:
        TFLW_CODE: ${{ steps.run.outputs.code }}
      run: exit "${TFLW_CODE:-1}"
