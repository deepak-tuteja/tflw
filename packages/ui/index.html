<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tflw</title>
    <!-- The docs site's mark (`packages/docs-site/public/favicon.svg`), copied: U7 found the tab iconless and every load logging a 404. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- `M213` `S0` (`D1096`) — the theme, stamped before the first paint.
         This has to run here and not in React: the app mounts after the browser has already
         painted once, so reading the choice in an effect shows the default for a frame and then
         swaps. That flash is worst for `Paper`, which is the light one. No bundler, no dependency
         on the app having loaded — and `ThemePick` writes the same attributes, so the two agree by
         construction rather than by being kept in step.
         `M258` (`D1411`): the picker stores `paper` or `terminal`, and `compact` beside it. The
         other two sets are reached by `?theme=` on the address, which wins over the stored choice
         and is never stored — the address keeps it across a reload (`api.ts` keeps the search). -->
    <script nonce="__TFLW_NONCE__">
      var root = document.documentElement;
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'terminal' || q === 'ribbon' || q === 'paper' || q === 'instrument') {
        root.setAttribute('data-tflw-theme', q);
      }
      try {
        var t = localStorage.getItem('tflw.theme');
        if (!root.hasAttribute('data-tflw-theme') && (t === 'terminal' || t === 'paper')) {
          root.setAttribute('data-tflw-theme', t);
        }
        if (localStorage.getItem('tflw.density') === 'compact') {
          root.setAttribute('data-tflw-density', 'compact');
        }
      } catch (e) {
        /* no storage (a private window, or it is turned off) — `Paper` is the default (`D1315`) */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
